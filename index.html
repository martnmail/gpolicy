<h1>rclone-gdrive</h1>
<p>rclone-gdrive is a personal application that accesses Google Drive to store and retrieve files on behalf of its owner.</p>
<p>It uses the Google Drive API with the restricted <code>drive.file</code> scope, meaning it can only access files it has created itself.</p>
